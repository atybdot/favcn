name: deploy

# Production deploys run here, never from a laptop.
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   - token with "Workers Scripts: Edit"
#   CLOUDFLARE_ACCOUNT_ID  - 6fb5e557b20b9eebaf2832ad025d2577
on:
  push:
    branches: [development]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm check-types

      - name: build
        run: pnpm build

      # Uses the wrangler version pinned in package.json. Newer wrangler
      # refuses the legacy_env field the cloudflare plugin writes.
      - name: deploy
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
